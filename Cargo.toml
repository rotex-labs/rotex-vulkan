[package]
name = "rotex-vulkan"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Vulkan backend for rotex_core"
documentation = "https://docs.rs/rotex-vulkan"
repository = "https://github.com/rotex-labs/rotex-vulkan"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
async-trait = "0.1.89"
rotex-core = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "1fe8f0abdfb8545ba4b9cfa9465d085eaf3fb799" }
rotex-types = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "1fe8f0abdfb8545ba4b9cfa9465d085eaf3fb799" }
ash = "0.38.0"
ash-window = "0.13.0"
raw-window-handle = "0.6.2"

[dev-dependencies]
pollster = "0.4.0"
rotex-conformance = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "1fe8f0abdfb8545ba4b9cfa9465d085eaf3fb799" }
